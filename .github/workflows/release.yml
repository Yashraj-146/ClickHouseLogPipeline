name: Release

# CD workflow: builds a verified jar, packages it into a Docker image, publishes that
# image to GitHub Container Registry, and cuts a GitHub Release - all triggered by
# pushing a version tag (e.g. v1.2.0). Nothing here deploys to any cloud platform;
# publishing a reusable image is the deliverable (see CLAUDE.md / README.md).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # to create the GitHub Release
  packages: write # to push the image to GHCR

jobs:
  build-and-publish:
    name: Build, Publish Image & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # Runs the full test suite as part of `package` - a tag is only released once the
      # exact code being shipped has been verified, not just whatever CI saw earlier.
      - name: Build verified application jar
        run: ./mvnw --batch-mode --no-transfer-progress package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        # GHCR requires a lowercase repository path; github.repository preserves case.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            target/*.jar \
            --title "${{ github.ref_name }}" \
            --generate-notes
