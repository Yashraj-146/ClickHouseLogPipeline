spring.application.name=clickhousepipeline

# Use environment variables in Docker Compose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

# Connection pool settings (optional but nice)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Logging level (your package)
logging.level.com.yashraj.clickhousepipeline=INFO

# --- BatchWriter tuning ---
# Defaults are the project's original hardcoded values. Tests override these to shrink
# batch size / flush interval / queue capacity for deterministic, fast assertions -
# production behavior is unchanged unless these are explicitly overridden.
pipeline.batch.size=${PIPELINE_BATCH_SIZE:1000}
pipeline.batch.flush-interval-ms=${PIPELINE_BATCH_FLUSH_INTERVAL_MS:1000}
pipeline.batch.queue-capacity=${PIPELINE_BATCH_QUEUE_CAPACITY:100000}

# --- Kafka ingestion (additional transport, see CLAUDE.md) ---
# "direct"  -> IngestionService writes straight to BatchWriter.enqueue() (original path).
# "kafka"   -> IngestionService publishes to Kafka; LogConsumer reads and calls
#              BatchWriter.enqueue() itself. Either way, BatchWriter remains the only
#              component that writes to ClickHouse.
pipeline.ingestion.mode=${PIPELINE_INGESTION_MODE:direct}

pipeline.kafka.topic=${PIPELINE_KAFKA_TOPIC:logs}
pipeline.kafka.partitions=${PIPELINE_KAFKA_PARTITIONS:3}
pipeline.kafka.consumer.concurrency=${PIPELINE_KAFKA_CONSUMER_CONCURRENCY:3}

# Host-facing default (localhost:29092) so the app also runs outside Docker against the
# host-mapped Kafka port. Docker Compose overrides this to kafka:9092 for container-to-
# container traffic.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:log-pipeline}
