# Test-only configuration.
#
# IMPORTANT: Spring Boot resolves "classpath:/application.properties" as a single location -
# when both src/main/resources and src/test/resources provide one, the test-classpath copy
# wins outright and the main one is NOT merged in. That means every property the app needs to
# start (datasource url/username/password have no defaults in the main file) must be restated
# here, even though nothing in this suite ever opens a real connection.
#
# Every Spring test in this suite replaces JdbcTemplate with @MockitoBean, so these datasource
# values are never actually used to connect - they only need to be present so property
# resolution and DataSource bean creation succeed.
spring.application.name=clickhousepipeline-test

spring.datasource.url=jdbc:clickhouse://localhost:8123/logs_test?compress=0
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

logging.level.com.yashraj.clickhousepipeline=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN

# Ingestion defaults to direct mode; KafkaModeIngestionIntegrationTest overrides this
# (and the Kafka properties below) via @TestPropertySource / @DynamicPropertySource.
pipeline.ingestion.mode=direct

pipeline.kafka.topic=logs
pipeline.kafka.partitions=3
pipeline.kafka.consumer.concurrency=1

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=log-pipeline-test

# Same defaults as production; individual tests override with tiny values (via
# @TestPropertySource) where they need deterministic, fast batching behavior.
pipeline.batch.size=1000
pipeline.batch.flush-interval-ms=1000
pipeline.batch.queue-capacity=100000
