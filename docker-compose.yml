version: "3.9"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native protocol
      - "9009:9009"
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - clickhouse
    volumes:
      - ./grafana_data:/var/lib/grafana
    restart: always

  # KRaft-mode broker (no ZooKeeper). Pinned to 3.9.1 to match the kafka-clients version
  # that the Spring Boot 3.5.8 BOM pulls in for spring-kafka, so client and broker are
  # on the exact same protocol version.
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for other containers (log-service, kafka-ui), PLAINTEXT_HOST is for
      # the host machine, CONTROLLER is the internal KRaft quorum listener.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Fixed so the cluster ID is reproducible across `docker compose down` / `up`
      # cycles instead of being freshly generated on first boot each time.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "29092:29092"   # host access, e.g. from a local kafka-console tool
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: always

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    restart: always

  log-service:
    build: .
    container_name: log-service
    depends_on:
      clickhouse:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:clickhouse://clickhouse:8123/logs?compress=0
      SPRING_DATASOURCE_USERNAME: default
      SPRING_DATASOURCE_PASSWORD: ""
      SERVER_PORT: 8080
      # Set to "direct" to fall back to the original queue-only path with no Kafka
      # involvement at all (see IngestionService / CLAUDE.md).
      PIPELINE_INGESTION_MODE: kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  clickhouse_data:
  grafana_data:
  kafka_data: